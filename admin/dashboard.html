<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexGen Admin Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><aside class="sidebar"><div class="brand-dot">NG</div><h2>NexGen Admin</h2><nav><a class="active">Applications</a><button id="logoutBtn">Logout</button></nav></aside><main class="main"><header><div><span class="eyebrow">Dashboard</span><h1>Applications</h1></div></header><section class="cards" id="cards"></section><section class="panel"><div class="filters"><input id="search" placeholder="Search name, phone, email, reference"><select id="status"><option value="">All statuses</option><option>Pending</option><option>Under Review</option><option>Approved</option><option>Rejected</option></select><input id="from" type="date"><input id="to" type="date"><select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select><button class="btn small" id="applyFilters">Apply</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Applicant</th><th>Phone</th><th>Email</th><th>Status</th><th>Submitted</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button id="prev">Previous</button><span id="pageInfo"></span><button id="next">Next</button></div></section></main><div class="modal" id="modal"><div class="modal-card"><button class="close" id="closeModal">×</button><div id="modalBody"></div></div></div><script src="admin.js"></script></body></html>
